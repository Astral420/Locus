[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locus-sidecar"
version = "0.1.0"
description = "Offline ML sidecar for Locus"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "Pillow>=10.0",
  "chromadb>=0.5",
  "sherpa-onnx>=1.12",
  # RapidOCR (slide text) is installed with --no-deps by scripts/setup-sidecar.sh, because it would
  # otherwise pull "opencv-python" in next to opencv-python-headless. Its requirements:
  "onnxruntime>=1.17",
  "pyclipper>=1.3",
  "shapely>=2.0",
  "PyYAML>=6",
  "tqdm>=4",
  "six>=1.16"
]
pyannote = ["pyannote.audio>=3.3"]

[tool.setuptools]
packages = ["sidecar", "sidecar.src", "sidecar.src.rpc", "sidecar.src.diarization", "sidecar.src.slides", "sidecar.src.vectordb", "sidecar.src.utils"]
