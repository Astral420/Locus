[package]
name = "locus"
version = "0.1.0"
description = "Offline-first meeting library"
authors = ["Locus contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "locus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
flate2 = "1"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
whisper-rs = { version = "0.16", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
